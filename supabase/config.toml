# Supabase local development configuration
# This file is used when running `supabase start` for local development

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323
api_url = "http://localhost"

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:8081"
additional_redirect_urls = ["https://localhost:8081"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

# Edge Functions: gateway JWT verification only supports legacy HS256. Projects using
# JWT Signing Keys (asymmetric) get 401 "Invalid JWT" before the function runs.
# Auth is enforced in each function via verifyJwtAndGetUserId → auth.getClaims().
# @see https://supabase.com/docs/guides/functions/auth
[functions.generate-habits]
verify_jwt = false

[functions.analyze-failure]
verify_jwt = false

[functions.onboarding-chat]
verify_jwt = false

[functions.weekly-iteration]
verify_jwt = false

[functions.delete-account]
verify_jwt = false
